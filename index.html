<style>
/* 曲げわっぱの木の箱に、色とりどりのおかず。箱は大きく、おかずは下の台に並ぶ */
:root{
  --bg:#f4ecdf; --paper:#fffaf2; --ink:#3a2a1f; --ink2:#7a6656; --line:#3a2a1f22;
  --wood:#c98f57; --wood2:#9c6a3c; --rice:#fbf6ea; --red:#d2543d; --red2:#9e3b29; --leaf:#5f9a4a; --gold:#d79b2c;

  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--red)}.dots i.done{background:var(--ink)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--red2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red2)}
button.main.alt{background:var(--wood2);box-shadow:0 4px 0 #6d4826}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--red2);display:inline-flex;align-items:center;min-height:44px}
/* お弁当箱 */
.box{background:linear-gradient(90deg,#00000008 0 2px,transparent 2px 9px) var(--wood);border-radius:18px;padding:10px;box-shadow:inset 0 0 0 3px var(--wood2),0 6px 0 #6d482633}
.grid{display:grid;gap:0;background:var(--rice);border-radius:10px;padding:3px;box-shadow:inset 0 2px 6px #00000022;touch-action:manipulation}
.cell{all:unset;cursor:pointer;aspect-ratio:1;border-radius:0;background:transparent;border:1px solid #3a2a1f14;display:grid;place-items:center;font-size:clamp(18px,6vw,28px);position:relative;box-sizing:border-box}
.cell.blk{background:repeating-linear-gradient(45deg,var(--wood) 0 4px,var(--wood2) 4px 6px);cursor:default}
.cell.on{background:var(--c);border-width:2px;border-style:solid}
.cell.cand{outline:2px dashed var(--red);outline-offset:-2px}
.cell.lock::after{content:"";position:absolute;inset:3px;border:2px solid #ffffffaa;border-radius:4px}
.cell.flash{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.6);filter:brightness(1.35)}60%{transform:scale(1.08)}100%{transform:none}}
.cell.wave{animation:wave .5s ease-out both}
@keyframes wave{0%{transform:none}45%{transform:scale(1.14);filter:brightness(1.25)}100%{transform:none}}
.cell.gap{background:repeating-linear-gradient(45deg,#d2543d22 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 2px #d2543d88}
.status .warn{color:var(--red2);font-weight:800}
.box.win{animation:win .6s}
@keyframes win{30%{transform:rotate(-2deg) scale(1.03)}60%{transform:rotate(2deg) scale(1.03)}}

.pc.used{opacity:.25}

.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}

.title{font-weight:800;font-size:38px;letter-spacing:.08em;text-align:center;margin:4px 0 0}

.rank{text-align:center;font-size:13px;color:var(--red2)}

.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:26px;text-align:center;margin:0}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.minis .box{padding:5px;border-radius:10px}
.minis .grid{padding:1px;border-radius:6px}
.minis>div{min-width:0}
.minis .cell{font-size:10px;border-radius:2px;min-width:0;overflow:hidden}
.minis p{margin:4px 0 0;text-align:center;font-size:12px;color:var(--ink2)}
/* おかず図鑑 */
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dex div{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:44px}
.dex b{font-size:26px}
.dex span{font-size:13px;color:var(--ink2);line-height:1.4}
.dex span em{font-style:normal;color:var(--ink);font-weight:800;font-size:14px}
.dex .no b{filter:grayscale(1);opacity:.3}
.lv{display:flex;gap:8px}
.lv button{flex:1}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--red2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
/* 実績・カレンダー */
.ach-new{background:#fff1cf;color:#6b4300;border:1px solid #d79b2c66;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:800;margin:0;text-align:center}
.achs{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ach .ic{font-size:22px;text-align:center;filter:grayscale(1);opacity:.4}
.ach.got{border-color:#d79b2c99;background:#fff7e3}.ach.got .ic{filter:none;opacity:1}
.ach b{display:block;font-size:15px}.ach small{color:var(--ink2);font-size:12px;line-height:1.5}
.ach .pg{font-size:12px;color:var(--ink2);text-align:right;min-width:48px}
.ach .pg i{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.ach .pg i span{display:block;height:100%;background:var(--gold)}
.ach.got .pg{color:#9a6a10;font-weight:800}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav b{font-size:19px}
.calnav .icon:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--ink2)}
.cal .d{all:unset;box-sizing:border-box;min-height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);position:relative;line-height:1.1;min-width:0}
.cal .d.on{color:#fff;font-weight:800}
.cal .d.later{border:1.5px dashed var(--wood2);color:var(--ink);background:#c98f5722}
.cal .d.can{border:1.5px dotted var(--ink2);color:var(--ink);cursor:pointer;background:var(--paper)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d small{font-size:10px}
.cal .d .h{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.5px #fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--ink2)}
.misses{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.misses .sub{flex:0 0 auto;min-width:84px}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタン（カレンダーのます目など）でも枠が消えないよう、いちばん最後に強く書く（2026-11-04 CodeRabbit） */
:is(.icon,button,a):focus-visible{outline:2px solid var(--red)!important;outline-offset:2px}
</style>

<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/bento-zume/";
const FEEDBACK = "https://github.com/satou-aaaaa/bento-zume/issues/new?template=feedback.yml";
const KEY = "bento-v1", EPOCH = "2026-11-04";
const B = window.BENTO;

// ---- 日付と種（日本時間。だれでも同じ3箱）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
// 今日の3箱：小・中・大。上級：特盛2箱（仕切りあり・ヒントなし）
const dailyList = (k) => B.SIZES.map((S, i) => ({ seed: B.seedOf(k + ":d:" + i), s: i }));
const hardList = (k) => [0, 1].map((i) => ({ seed: B.seedOf(k + ":h:" + i), s: 3 }));
const sizeOf = (s) => (s === 3 ? B.HARD : B.SIZES[s]);
const cache = new Map();
const boxOf = (it) => { const k = it.seed + ":" + it.s; if (!cache.has(k)) cache.set(k, B.make(it.seed, sizeOf(it.s))); return cache.get(k); };
const starsOf = (h) => (h === 0 ? 3 : h === 1 ? 2 : 1);
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// 進行中の遊びはモードごとに分けて持つ（練習を始めても今日・上級の途中経過を消さない）。eat：おかず → 詰めた数
const fresh = () => ({ v: 1, days: {}, hdays: {}, pdays: {}, eat: {}, boxes: 0, runs: {}, tut: false, kofi: {}, ach: {} }); // pdays：取りこぼした日をあとから遊んだ結果（連続の日・今日の記録には数えない）。ach：結果の画面で知らせ終えた実績
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
// 保存に失敗したあとはメモリと保存の両方を読む。記録（日ごとの結果・図鑑）は合わせて数は高いほう、途中経過は同じ日・同じ箱なら進んだほう
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ h: r.res.map((x) => x.h) });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.pdays : null); // モードごとの日ごとの記録（練習は無し）
// あとから遊ぶ回は日付ごとに runs["a:日付"] へ置く（別の日を選んでも、前の日の途中経過を消さない）
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date]) return false; b[r.date] = recOf(r); return true; }
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); a = Object.assign(fresh(), a); b = Object.assign(fresh(), b); /* 合わせる前に両方を fresh() で補う（片方にしか無い新しいキーを失わない） */ const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur && r.cur.placed ? Object.keys(r.cur.placed).length : 0), idOf = (r) => JSON.stringify([r.list || null, r.id || null]); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; } if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (bd && !bd[r.date]) s.runs[m] = r; continue; } if (x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; } else if (idOf(x) === idOf(y)) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; } } return s; }
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const RANKS = [[0, "見習い"], [10, "お弁当係"], [40, "詰め名人"], [120, "弁当職人"], [300, "弁当の達人"]];
const rankOf = (n) => RANKS.filter((r) => n >= r[0]).pop()[1];
const nextRank = (n) => RANKS.find((r) => r[0] > n);
// 実績：いまの記録から毎回数える（腕前・集める・続けるをまぜる）。[id, 絵, 名前, 条件, (記録) => [いま, 目標]]
const DAYRE = /^\d{4}-\d\d-\d\d$/;
const recs = (b) => Object.entries(b || {}).filter(([k, r]) => DAYRE.test(k) && r && Array.isArray(r.h)).map(([, r]) => r);
const clean = (b) => recs(b).filter((r) => r.h.length && r.h.every((h) => h === 0)).length; // ヒントなしで終えた日
const n0 = (s) => [s.days, s.hdays, s.pdays].reduce((t, b) => t + recs(b).reduce((u, r) => u + r.h.filter((h) => h === 0).length, 0), 0); // ヒントなしで詰めた箱（今日・上級・あとから）

  for (let i = 0; i < own.length; i++) if (own[i] < 0 && !p.blocks.includes(i)) return;
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.done = true; buzz([10, 40, 10]);
  const st = starsOf(cur.hints);
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; r.res.push({ h: cur.hints }); r.cur = null; s.boxes++; for (const t of p.tray) s.eat[t.food[0]] = (s.eat[t.food[0]] || 0) + 1; });
  paint();
  const r = s.runs[MODE], fin = r && r.res.length >= r.list.length;
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">できあがり！ ${starStr(st)}</div>
    <p class="note">${p.tray.map((t) => t.food[1]).join("")}<br>${p.ways <= 1 ? "詰め方が1通りしかない箱でした。" : `この箱の詰め方は全部で${p.ways >= 300 ? "300通り以上" : p.ways + "通り"}。`}</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次の箱へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  let first = false;
  const rec = { h: run.res.map((r) => r.h) };
  save((s2) => {
    first = bank(s2, run);
    // 別のタブで同じモードの新しい回が始まっていたら、それは消さない
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec });
  result(run.mode, run.date, first);
}
// 共有の文：箱の形・答えは出さない。ヒントの数だけ色を変える
const sq = (h) => (h === 0 ? "🍱" : h === 1 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  return `お弁当づめ${mode === "h" ? " 特盛" : ""} #${dayNo(k)} ${md(k)}\n${rec.h.map(sq).join("")}${rec.h.every((h) => h === 0) ? " ヒントなしで完成" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "h" ? hardList(k) : dailyList(k);
  const rec = mode === "p" ? prec : bookOf(s, mode)[k];
  if (!rec) return home();
  const total = rec.h.reduce((a, b) => a + b, 0), text = shareText(mode, k, rec), share = mode === "d" || mode === "h"; // 練習・あとからはシェアしない
  const showKofi = first && share && total === 0 && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  const got = achOf(s).filter((a) => a.got && !s.ach[a.id]); // 新しく取れた実績は、結果の画面で1度だけ小さく知らせる
  if (got.length) save((s2) => { for (const a of got) s2.ach[a.id] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>お弁当づめ<small>${mode === "d" ? `今日の3箱 #${dayNo(k)}` : mode === "h" ? "上級：特盛" : mode === "a" ? `${md(k)}・あとから` : "練習"}</small></h1><span></span></header>
    <p class="big">${total === 0 ? "ヒントなしで完成！" : `${list.length}箱 完成（ヒント ${total}）`}</p>
    <div class="minis">${list.map((it, j) => { const p = boxOf(it); return `<div>${boxHtml(p, solOwn(p), { mini: true })}<p>${p.size} ${starStr(starsOf(rec.h[j]))}</p></div>`; }).join("")}</div>
    ${got.length ? `<p class="ach-new">🏅 実績：${esc(got.length > 2 ? `${got[0].name} ほか${got.length - 1}つ` : got.map((a) => a.name).join("・"))}</p>` : ""}
    ${share ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🍱ヒントなし　🟨ヒント1回　🟧ヒント2回<br>次の3箱まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：特盛の2箱に挑む</button>` : ""}
    ${mode === "a" ? `<p class="note">あとから遊んだ日は、カレンダーに点線の印で残ります（連続の日には入りません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">おかず図鑑を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if ($("go-cal")) $("go-cal").onclick = () => calendar();
  if (share) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

function dex() {
  const s = load(), got = B.FOODS.filter((f) => s.eat[f[0]]).length;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>おかず図鑑<small>${got}/${B.FOODS.length}品・詰めた箱 ${s.boxes}</small></h1><span></span></header>
    <p class="note">詰めたおかずが集まります。1つの箱では、形のちがうおかずは必ずちがうおかずになります。</p>
    <div class="dex">${B.FOODS.map((f) => s.eat[f[0]] ? `<div><b>${f[1]}</b><span><em>${f[0]}</em><br>${s.eat[f[0]]}回 詰めた</span></div>` : `<div class="no"><b>${f[1]}</b><span><em>？？？</em><br>まだ出会っていない</span></div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

function achView() {
  const s = load(), list = achOf(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${list.filter((a) => a.got).length}/${ACH.length}</small></h1><span></span></header>
    <div class="achs">${list.map((a) => `<div class="ach${a.got ? " got" : ""}"><span class="ic" aria-hidden="true">${a.ic}</span><div><b>${a.name}</b><small>${a.cond}</small></div><div class="pg">${a.got ? "達成" : `${a.n}/${a.g}<i><span style="width:${(a.n / a.g * 100).toFixed(0)}%"></span></i>`}</div></div>`).join("")}</div>${footer()}`;
  $("back").onclick = home;
  bindFooter();
  window.scrollTo(0, 0);
}
// 遊んだ日のカレンダー：今日の3箱の★の合計で色の濃さ・上級は小さな点・あとから遊んだ日は点線・遊べる取りこぼした日は ↺
function calendar(ym) {
  const s = load(), k = todayKey(), first = EPOCH.slice(0, 7), last = k.slice(0, 7);
  ym = ym && ym >= first && ym <= last ? ym : last;
  const [y, m] = ym.split("-").map(Number), d0 = new Date(Date.UTC(y, m - 1, 1)), nd = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const miss = missed(s, k), st = streak(s.days), sum = (r) => r.h.reduce((t, h) => t + starsOf(h), 0);
  const prevYm = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 7), nextYm = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7);
  let cells = "";
  for (let i = 0; i < d0.getUTCDay(); i++) cells += "<span></span>";
  for (let d = 1; d <= nd; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, r = s.days[key], a = s.pdays[key], h = s.hdays[key] ? `<i class="h" aria-hidden="true"></i>` : "", td = key === k ? " today" : "";
    if (r && Array.isArray(r.h)) { const n = sum(r), f = n / (r.h.length * 3); cells += `<span class="d on${td}" data-k="${key}" style="background:rgba(210,84,61,${(0.35 + 0.65 * f).toFixed(2)})${f < 0.7 ? ";color:var(--ink)" : ""}" aria-label="${m}月${d}日 ★${n}">${d}<small>★${n}</small>${h}</span>`; }
    else if (a && Array.isArray(a.h)) cells += `<span class="d later${td}" data-k="${key}" aria-label="${m}月${d}日 あとから ★${sum(a)}">${d}<small>★${sum(a)}</small>${h}</span>`;
    else if (miss.includes(key)) cells += `<button class="d can" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ">${d}<small>↺</small></button>`;
    else cells += `<span class="d${td}">${d}${h}</span>`;
  }
  const live = (d) => { const r = s.runs["a:" + d]; return r && !doneOf(r) && (r.res.length || r.cur); };
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー</h1><span></span></header>
    <div class="calnav"><button class="icon" id="cal-prev" aria-label="前の月"${ym <= first ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="icon" id="cal-next" aria-label="次の月"${ym >= last ? " disabled" : ""}>›</button></div>
    ${st >= 1 ? `<p class="note" id="cal-st">${st}日つづけて詰めています</p>` : ""}
    <div class="cal">${"日月火水木金土".split("").map((w) => `<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="legend"><span>■ 今日の3箱（濃いほど★が多い）</span><span>⬚ あとから</span><span>● 上級</span></div>
    ${miss.length ? `<p class="note">↺ 取りこぼした日の3箱を、あとから遊べます（連続の日には入りません）</p><div class="misses">${miss.map((d) => `<button class="sub" data-k="${d}">${md(d)}${live(d) ? " 続き" : ""}</button>`).join("")}</div>` : ""}
    ${footer()}`;
  $("back").onclick = home;
  if (ym > first) $("cal-prev").onclick = () => calendar(prevYm);
  if (ym < last) $("cal-next").onclick = () => calendar(nextYm);
  document.querySelectorAll(".cal button.d, .misses button").forEach((b) => (b.onclick = () => startRun("a", b.dataset.k)));
  bindFooter();
  window.scrollTo(0, 0);
}

home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
